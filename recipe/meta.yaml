{% set version = "0.6.0" %}
{% set python_min = "3.11.0" %}

package:
  name: jax-rrtmgp
  version: {{ version }}

source:
  url: https://files.pythonhosted.org/packages/source/j/jax-rrtmgp/jax_rrtmgp-{{ version }}.tar.gz
  sha256: 80839c5591149ab1d5dfe2628ca0eb1e09964b924c6536024c631aa35e4468a4

build:
  noarch: python
  script: {{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  number: 0

requirements:
  host:
    - python {{ python_min }}
    - setuptools >=61.0
    - pip
  run:
    - python >={{ python_min }}
    - dataclasses-json
    - jax
    - netcdf4
    - numpy

test:
  imports:
    - rrtmgp
  commands:
    - pip check
  requires:
    - pip
    - python {{ python_min }}

about:
  home: https://github.com/climate-analytics-lab/jax-rrtmgp
  dev_url: https://github.com/climate-analytics-lab/jax-rrtmgp
  summary: JAX-based implementation of RRTMGP radiative transfer for atmospheric modeling.
  license: Apache-2.0
  license_file: LICENSE

extra:
  recipe-maintainers:
    - mahf708
